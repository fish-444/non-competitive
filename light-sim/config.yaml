# 실내 재배 공간 광 분포 — 예시 설정
#
# 길이 단위는 전부 미터. 좌표계는 x=폭, y=깊이, z=위(바닥이 0).
# 격자는 공간 한가운데 놓이므로 화분은 (row, col) 만 적으면 된다.

label: 기본배치

space:
  width: 2.4        # x
  depth: 1.2        # y
  height: 2.2       # z (천장)

grid:
  rows: 5
  cols: 10
  row_spacing: 0.22
  col_spacing: 0.22

photoperiod_hours: 16     # DLI = PPFD x 이 시간
extinction_k: 0.7         # 소산계수. 투과율 = exp(-k x LAI)

# 광원 — position 은 [x, y, z], ppf 는 µmol/s, beam_angle 은 전체 퍼짐각(도).
# 천장 바로 아래(z=1.9)에 바 4개를 폭 방향으로 나눠 달았다.
lights:
  - position: [0.30, 0.60, 1.90]
    ppf: 420
    beam_angle: 120
  - position: [0.90, 0.60, 1.90]
    ppf: 420
    beam_angle: 120
  - position: [1.50, 0.60, 1.90]
    ppf: 420
    beam_angle: 120
  - position: [2.10, 0.60, 1.90]
    ppf: 420
    beam_angle: 120

# 화분 50개 (5 x 10). 키·캐노피·LAI 가 조금씩 달라 서로 그늘을 만든다.
